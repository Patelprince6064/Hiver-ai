generation:
  enabled: true
  default_method: "grounded_llm"

  generic_baseline:
    enabled: true
    fallback_reply: "Thanks for reaching out. We're sorry you're experiencing this issue. Please provide more details so our support team can assist you."

  historical_baseline:
    enabled: true
    top_k: 1
    require_evidence: true
    min_similarity: null

  grounded_llm:
    enabled: true
    provider: "openai"
    model: "gpt-4o-mini"
    temperature: 0.0
    max_tokens: 300
    timeout: 30
    max_retries: 1
    prompt_version: "v1"
    evidence_top_k: 3
    min_similarity: null
    deduplicate_evidence: true

  safety_filters:
    enabled: true
    detect_pii: true
    detect_urls: true
    detect_identifiers: true

  reply_eval:
    output_dir: "data/interim/reply_eval"
    results_dir: "evaluation/results"
