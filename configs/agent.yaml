# End-to-End Agent Configuration
# Phase 17 — Integration

agent:
  mode: "production"  # production | mock
  
  # Input validation
  input:
    max_message_length: 10000
    max_context_length: 50
  
  # Intent classification (Phase 8)
  intent:
    model: "sentence-transformers/all-MiniLM-L6-v2"
    min_confidence: 0.70
  
  # Retrieval (Phase 10)
  retrieval:
    top_k: 5
    min_similarity: null
    intent_reranking: true
    intent_boost: 0.1
  
  # Evidence selection (Phase 12)
  evidence:
    max_evidence: 3
  
  # Grounded reply generation (Phase 12)
  generation:
    enabled: true
    temperature: 0.0
    max_tokens: 300
    prompt_version: "v1"
  
  # Grounding verification (Phase 13)
  grounding:
    required: true
    min_phrase_overlap: 0.1
  
  # Escalation policy (Phase 15-16)
  escalation:
    policy_version: "v1.1"
    min_intent_confidence: 0.70
    min_confidence_margin: 0.15
    require_evidence: true
    escalate_on_high_risk: true
    escalate_on_ambiguous: true
    escalate_on_multi_intent: true
    escalate_on_repeated_unresolved: true
    escalate_on_complex_conversation: true
    high_risk_default_escalate: true
  
  # Trace logging
  trace:
    enabled: true
    log_level: "INFO"
  
  # Safety
  safety:
    fail_closed: true
    no_external_actions: true
  
  # Mock mode
  mock:
    response: "This is a mock response for testing."
    latency_ms: 50.0

# LLM provider
llm:
  provider: "mock"  # mock | openai
  model: "gpt-3.5-turbo"
  temperature: 0.0
  max_tokens: 300

# Paths
paths:
  classifier_model: "models/intent_classifier/"
  retrieval_index: "models/retrieval_index/"
  evaluation_results: "evaluation/results/"
